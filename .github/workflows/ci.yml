name: CI

# Пушимо напряму в main (без pull request-ів) — тому запускаємо і на push,
# і на pull_request, щоб перевірка реально спрацьовувала для поточного
# робочого процесу (SEO-аудит Vercel, 09.10.2026, пункт 4.3).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
